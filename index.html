<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposta de Contabilidade | Lucas Araújo</title>
    <link rel="icon" type="image/png" href="https://www.virgulacontabil.com.br/wp-content/uploads/2026/01/cropped-favicon-1-1.png">
    
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style type="text/tailwindcss">
        @theme inline {
            --radius-md: 0.75rem;

            --color-background: var(--background);
            --color-foreground: var(--foreground);

            --color-card: var(--card);
            --color-card-foreground: var(--card-foreground);

            --color-primary: var(--primary);
            --color-primary-foreground: var(--primary-foreground);

            --color-secondary: var(--secondary);
            --color-secondary-foreground: var(--secondary-foreground);

            --color-muted: var(--muted);
            --color-muted-foreground: var(--muted-foreground);

            --color-accent: var(--accent);
            --color-accent-foreground: var(--accent-foreground);

            --color-border: var(--border);
            --color-ring: var(--ring);

            --font-serif: "Fraunces", ui-serif, Georgia, serif;
            --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        :root {
            --background: oklch(0.982 0.012 90);         /* creme quente quase branco */
            --foreground: oklch(0.22 0.02 160);           /* verde-escuro acinzentado para texto */

            --card: oklch(0.995 0.006 90);                /* branco-creme para superfícies */
            --card-foreground: oklch(0.22 0.02 160);

            --primary: oklch(0.36 0.06 165);              /* verde-floresta profundo */
            --primary-foreground: oklch(0.98 0.012 90);   /* creme para texto sobre primary */

            --secondary: oklch(0.94 0.02 90);             /* bege claro para fundos secundários */
            --secondary-foreground: oklch(0.28 0.04 165);

            --muted: oklch(0.94 0.015 90);
            --muted-foreground: oklch(0.48 0.02 160);     /* verde acinzentado médio para textos secundários */

            --accent: oklch(0.72 0.14 55);                /* terracota/âmbar — cor de destaque */
            --accent-foreground: oklch(0.2 0.03 60);

            --border: oklch(0.88 0.018 90);               /* borda sutil creme-acinzentada */
            --ring: oklch(0.36 0.06 165);                 /* mesmo que primary para foco */
        }

        body {
            font-family: var(--font-sans);
            font-feature-settings: "ss01", "cv11";
            background-color: var(--background);
            color: var(--foreground);
            margin: 0;
        }

        h1, h2, h3, h4 {
            font-family: var(--font-serif);
            letter-spacing: -0.02em;
        }
        
        /* Loading State */
        #root:empty {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--primary);
            font-weight: bold;
        }
        #root:empty::after {
            content: "Carregando sistema...";
        }

        @media print {
            @page {
                size: A4;
                margin: 10mm;
            }

            .no-print { display: none !important; }
            
            html, body { 
                height: auto !important; 
                overflow: visible !important; 
                background: white !important; 
                color: black !important; 
                padding: 0 !important; 
                margin: 0 !important; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
                font-size: 11pt;
            }
            
            #root { 
                height: auto !important; 
                display: block !important; 
                overflow: visible !important;
            }
            
            .proposal-container { 
                border: none !important; 
                box-shadow: none !important; 
                padding: 0 !important; 
                width: 100% !important; 
                max-width: none !important; 
                margin: 0 !important; 
            }
            
            .page-break { page-break-before: always; }
            .page-break-avoid { page-break-inside: avoid !important; }

            .print-grid-3 {
                display: grid !important;
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 1.5rem !important;
            }
            .print-grid-3 > div {
                width: auto !important;
                margin-bottom: 0 !important;
            }
            
            textarea { resize: none; overflow: hidden; border: none !important; }
        }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    
    <!-- Carrega o script principal como babel -->
    <script type="text/babel" data-type="module" data-presets="react" src="main.js"></script>
</body>
</html>
